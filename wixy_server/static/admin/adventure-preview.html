<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#040f20">

<title>Adventure Time preview</title>
<style>/* Adventure Time preview. A phone-first, full-height layout: top bar, the stage (the globe), the holiday
   pack when there is one, and the action dock. Nothing here is shipped. */

:root {
  --ink: #f5f8ff;
  --ink-dim: rgba(232, 241, 255, 0.72);
  --bg0: #040f20;
  --bg1: #0a2342;
  --glass: rgba(8, 24, 48, 0.62);
  --glass-edge: rgba(190, 220, 255, 0.18);
  --coral: #ff4d6a;
  --coral2: #ff7a59;
  --gold: #ffc933;
  --teal: #52dcae;
  --radius: 18px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --font: "SF Pro Rounded", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg0); color: var(--ink); font-family: var(--font); overscroll-behavior: none; }
body { position: fixed; inset: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-appearance: none; appearance: none; touch-action: manipulation; }
[hidden] { display: none !important; }

.app {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  background:
    radial-gradient(1.2px 1.2px at 12% 18%, rgba(255,255,255,.7), transparent 60%),
    radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1.4px 1.4px at 88% 64%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1px 1px at 24% 82%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1.2px 1.2px at 52% 40%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(120% 90% at 50% 38%, var(--bg1), var(--bg0) 72%);
  user-select: none; -webkit-user-select: none;
}

/* Top bar */
.bar {
  flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: calc(8px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));
}
.title { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 800; font-size: 17px; letter-spacing: .01em; white-space: nowrap; }
.title-text { overflow: hidden; text-overflow: ellipsis; }
.title-globe { font-size: 20px; }
.bar-actions { display: flex; flex: 0 0 auto; gap: 6px; }
.chip {
  border: 1px solid var(--glass-edge); background: var(--glass); color: var(--ink); border-radius: 999px;
  padding: 7px 13px; font-weight: 700; font-size: 14px; min-height: 36px; white-space: nowrap; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.chip:active { transform: scale(.96); }
.chip .count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 2px; border-radius: 9px; background: var(--gold); color: #3a2a00; font-size: 12px; line-height: 18px; text-align: center; }

/* Stage */
.stage { position: relative; flex: 0 1 100%; min-height: 0; overflow: hidden; transition: flex-basis .45s cubic-bezier(.3,.7,.2,1); }
.reduce .stage { transition: none; }
.globe { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.stage[data-interactive="none"] .globe { cursor: default; }
.stage[data-interactive="explore"] .globe { cursor: move; }
.stage:active[data-interactive="spin"] .globe { cursor: grabbing; }

.hint {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px);
  padding: 9px 18px 10px; border-radius: 22px; text-align: center; pointer-events: none;
  background: var(--glass); border: 1px solid var(--glass-edge); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 6px 24px rgba(0,0,0,.28); transition: opacity .25s;
}
.hint[data-show="0"] { opacity: 0; }
.hint-main { font-weight: 800; font-size: 18px; line-height: 1.2; }
.hint-sub { margin-top: 2px; font-size: 12.5px; color: var(--ink-dim); font-weight: 600; }
.toast {
  position: absolute; top: 74px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); padding: 8px 16px; border-radius: 16px;
  background: var(--coral); color: #fff; font-weight: 800; font-size: 15px; box-shadow: 0 6px 20px rgba(255,77,106,.4);
  pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap;
}
.toast[data-show="0"] { opacity: 0; transform: translateX(-50%) translateY(-6px); }
.nearest {
  position: absolute; top: 78px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); padding: 7px 14px; border-radius: 16px;
  background: rgba(255,255,255,.94); color: #14304f; font-weight: 800; font-size: 14px; pointer-events: none;
  box-shadow: 0 6px 20px rgba(0,0,0,.3); transition: opacity .25s; white-space: nowrap;
}
.nearest[data-show="0"] { opacity: 0; }

.lit { position: absolute; left: 10px; right: 10px; bottom: 12px; text-align: center; pointer-events: none; transition: opacity .15s; }
.lit[data-show="0"] { opacity: 0; }
.lit-name {
  display: inline-block; max-width: 100%; font-weight: 900; line-height: 1.1; font-size: clamp(28px, 9vw, 46px); color: #fff;
  text-shadow: 0 2px 0 rgba(4,20,40,.9), 0 0 18px rgba(255,201,51,.55), 0 3px 14px rgba(0,0,0,.6);
  -webkit-text-stroke: 1px rgba(4,20,40,.55); paint-order: stroke fill;
}
.lit-sub {
  margin: 8px auto 0; max-width: 460px; padding: 8px 14px; border-radius: 14px; font-size: 14px; line-height: 1.35; font-weight: 600;
  background: var(--glass); border: 1px solid var(--glass-edge); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.back { position: absolute; right: 10px; bottom: 12px; }

/* Debug */
.debug { position: absolute; left: 8px; bottom: 8px; font-size: 11px; color: var(--ink-dim); background: rgba(0,0,0,.45); border-radius: 8px; padding: 3px 8px; max-width: 70%; }
.debug summary { cursor: pointer; }
.debug-pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; font: 11px/1.35 ui-monospace, Menlo, Consolas, monospace; color: #cfe3ff; }
.stage[data-interactive="none"] .debug { bottom: auto; top: 76px; }

/* Pack panel */
.pack { flex: 0 0 auto; display: none; min-height: 0; }
.app[data-pack="pending"] .pack, .app[data-pack="ready"] .pack { display: flex; flex-direction: column; }
.pk-pending { display: none; align-items: center; gap: 12px; margin: 0 12px 6px; padding: 10px 14px; border-radius: var(--radius); background: var(--glass); border: 1px solid var(--glass-edge); }
.app[data-pack="pending"] .pk-pending { display: flex; }
.pk-pending-text { font-size: 15px; line-height: 1.3; }
.pk-pending-sub { color: var(--ink-dim); font-size: 12.5px; font-weight: 600; }
.pk-timer { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 800; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2); border-top-color: var(--gold); animation: spin 0.9s linear infinite; flex: 0 0 auto; }
.reduce .spinner { animation-duration: 3s; }
@keyframes spin { to { transform: rotate(360deg); } }
.pk-bar { display: none; align-items: center; justify-content: space-between; padding: 6px 12px 6px; }
.app[data-pack="ready"] .pk-bar { display: flex; }
.pk-bar-title { font-weight: 800; font-size: 15px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .08em; }
.pk-host { display: none; }
.app[data-pack="ready"] .pk-host { display: block; }
.app[data-pack="ready"][data-explore="0"] .stage { flex: 0 0 38%; }
.app[data-pack="ready"][data-explore="0"] .pack { flex: 1 1 0; }
.app[data-pack="ready"][data-explore="0"] .pk-host { flex: 1 1 0; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 12px 14px; }
.app[data-pack="ready"][data-explore="1"] .pk-host { display: none; }

.pk { max-width: 760px; margin: 0 auto; }
.pk-sample { margin: 2px 0 10px; padding: 8px 12px; border-radius: 12px; background: rgba(255,201,51,.12); border: 1px dashed rgba(255,201,51,.5); color: #ffe9a8; font-size: 12.5px; line-height: 1.35; font-weight: 600; }
.pk-place { font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--teal); font-weight: 800; }
.pk-headline { margin: 4px 0 8px; font-size: 21px; line-height: 1.22; font-weight: 800; }
.pk-summary { margin: 0 0 12px; color: var(--ink-dim); line-height: 1.5; font-size: 15px; }
.pk-card { margin: 0 0 10px; padding: 12px 14px 12px; border-radius: var(--radius); background: var(--glass); border: 1px solid var(--glass-edge); }
.pk-card h3 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--gold); font-weight: 800; }
.pk-card p { margin: 0; line-height: 1.45; font-size: 15px; }
.pk-items, .pk-sources { list-style: none; margin: 0; padding: 0; }
.pk-items li { padding: 8px 0; border-top: 1px solid rgba(190,220,255,.12); }
.pk-items li:first-child { border-top: 0; padding-top: 0; }
.pk-item-name { font-weight: 800; font-size: 15.5px; }
.pk-item-detail { margin-top: 2px; line-height: 1.42; font-size: 14.5px; color: var(--ink-dim); }
.pk-link { display: inline-block; margin-top: 5px; color: #8fd0ff; font-weight: 700; font-size: 13.5px; text-decoration: none; padding: 3px 0; }
.pk-link::after { content: " \2197"; }
.pk-sources li { padding: 3px 0; font-size: 13.5px; }
.pk-sources .pk-link { margin: 0; }

/* Dock */
.dock { flex: 0 0 auto; padding: 8px calc(12px + var(--safe-r)) calc(10px + var(--safe-b)) calc(12px + var(--safe-l)); min-height: 8px; }
.dock-row, .dock-block { display: none; }
.app[data-action="stop"] .dock-stop { display: flex; justify-content: center; }
.app[data-action="decide"] .dock-decide, .app[data-action="ask"] .dock-decide { display: block; }
.app[data-action="decide"] .dock-decide-row { display: flex; gap: 10px; }
.app[data-action="ask"] .dock-ask-row { display: flex; gap: 10px; }
.app[data-action="again"] .dock-again { display: block; }
.ask { text-align: center; font-weight: 800; font-size: 16px; margin: 0 0 8px; }
.ask:empty { display: none; }
.outcome { text-align: center; font-weight: 700; font-size: 15px; margin: 0 0 8px; color: var(--ink-dim); }
.outcome:empty { display: none; }

.stop {
  width: 100%; max-width: 560px; min-height: 76px; border: 0; border-radius: 40px; color: #fff; font-weight: 900; font-size: 28px; letter-spacing: .12em; text-transform: uppercase;
  background: linear-gradient(180deg, var(--coral2), var(--coral) 60%, #e0264f);
  box-shadow: 0 10px 28px rgba(255,77,106,.5), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(120,0,30,.28);
  text-shadow: 0 2px 0 rgba(120,0,30,.45); transition: transform .08s, filter .2s, opacity .2s;
  animation: stop-pulse 1.1s ease-in-out infinite;
}
.stop:active { transform: translateY(3px) scale(.985); box-shadow: 0 5px 16px rgba(255,77,106,.4), inset 0 2px 0 rgba(255,255,255,.3); }
.stop[data-live="0"] { filter: grayscale(.85) brightness(.75); animation: none; box-shadow: none; letter-spacing: .04em; font-size: 22px; opacity: .8; pointer-events: none; }
.reduce .stop { animation: none; }
@keyframes stop-pulse { 0%, 100% { box-shadow: 0 10px 28px rgba(255,77,106,.45), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(120,0,30,.28); } 50% { box-shadow: 0 10px 40px rgba(255,77,106,.8), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(120,0,30,.28); } }

.big { flex: 1 1 0; min-height: 56px; border-radius: 28px; border: 1px solid var(--glass-edge); font-weight: 800; font-size: 17px; padding: 10px 14px; background: var(--glass); }
.big.yes { background: linear-gradient(180deg, #6ff0c4, #2fc896); color: #052a1d; border: 0; box-shadow: 0 8px 22px rgba(82,220,174,.35); }
.big.no { background: rgba(255,255,255,.08); }
.big.keep { background: linear-gradient(180deg, #6ff0c4, #2fc896); color: #052a1d; border: 0; }
.big.again { width: 100%; background: linear-gradient(180deg, #ffd95e, #ffb21e); color: #3b2800; border: 0; box-shadow: 0 8px 22px rgba(255,201,51,.35); }
.big:active { transform: scale(.97); }
.forget { width: 100%; margin-top: 10px; font-size: 15px; min-height: 48px; }

/* Sheets */
.sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; background: rgba(2, 8, 18, .6); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.sheet-card {
  width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; padding: 16px 16px calc(18px + var(--safe-b));
  background: linear-gradient(180deg, #112c4d, #0a1f3a); border: 1px solid var(--glass-edge); border-radius: 24px 24px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.45);
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sheet-head h2 { margin: 0; font-size: 20px; }
@media (min-width: 700px) { .sheet { align-items: center; } .sheet-card { border-radius: 24px; } }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-top: 1px solid rgba(190,220,255,.12); cursor: pointer; }
.opt-title { font-weight: 800; font-size: 16px; }
.opt-help { margin-top: 2px; font-size: 13.5px; line-height: 1.35; color: var(--ink-dim); }
.switch { position: relative; flex: 0 0 auto; width: 52px; height: 32px; }
.switch-input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch-track { position: absolute; inset: 0; border-radius: 16px; background: rgba(255,255,255,.18); transition: background .2s; pointer-events: none; }
.switch-knob { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); transition: transform .2s; }
.switch-input:checked + .switch-track { background: var(--teal); }
.switch-input:checked + .switch-track .switch-knob { transform: translateX(20px); }
.switch-input:focus-visible + .switch-track { outline: 2px solid #fff; outline-offset: 2px; }
.reduce .switch-track, .reduce .switch-knob { transition: none; }
.bank-list { list-style: none; margin: 0; padding: 0; }
.bank-list li { padding: 10px 0; border-top: 1px solid rgba(190,220,255,.12); }
.bank-name { font-weight: 800; font-size: 16px; }
.bank-where { color: var(--teal); font-size: 13px; font-weight: 700; margin-top: 1px; }
.bank-blurb { color: var(--ink-dim); font-size: 13.5px; margin-top: 3px; line-height: 1.35; }
.bank-empty { color: var(--ink-dim); }

@media (max-width: 440px) {
  .bar { gap: 4px; padding-left: calc(10px + var(--safe-l)); padding-right: calc(8px + var(--safe-r)); }
  .title { font-size: 15px; gap: 5px; }
  .title-globe { font-size: 16px; }
  .bar-actions { gap: 4px; }
  .chip { padding: 6px 9px; font-size: 12.5px; min-height: 34px; }
  .chip .count { margin-left: 1px; min-width: 16px; line-height: 16px; font-size: 11px; }
}
@media (max-width: 380px) {
  .title-globe { display: none; }
  .title { font-size: 15px; }
  .chip { padding: 6px 10px; font-size: 13px; }
  .hint-main { font-size: 16.5px; }
  .big { font-size: 15.5px; padding: 8px 10px; }
  .dock-decide-row, .dock-ask-row { flex-wrap: wrap; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .bar { padding-top: calc(4px + var(--safe-t)); padding-bottom: 4px; }
  .stop { min-height: 56px; font-size: 22px; }
  .hint { top: 4px; padding: 5px 14px 6px; }
  .hint-main { font-size: 15px; }
  .toast, .nearest { top: 56px; }
}

/* The holiday pack as a magazine page: hero carousel, photo cards, full-screen viewer. Loaded after
   adventure-harness.css (the build concatenates the two). */

.pk-body { padding: 2px 2px 0; }
.pk-headline { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; font-size: 25px; line-height: 1.16; letter-spacing: -0.005em; font-weight: 700; margin: 4px 0 10px; }
.pk-summary { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; font-size: 16.5px; line-height: 1.58; color: rgba(236, 244, 255, 0.86); margin: 0 0 16px; }
.pk-icon { margin-right: 8px; font-size: 15px; }
.pk-card h3 { display: flex; align-items: center; }

.hero { position: relative; margin: 0 -12px 14px; border-radius: 0 0 22px 22px; overflow: hidden; background: #0c2744; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
.hero-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
.hero-track::-webkit-scrollbar { display: none; }
.hero-slide { position: relative; flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always; aspect-ratio: 16 / 10; max-height: 46vh; width: 100%; padding: 0; border: 0; background: #0c2744; overflow: hidden; cursor: zoom-in; }
.hero-slide img { display: block; width: 100%; height: 100%; object-fit: cover; }
.hero-slide.pk-photo-failed { display: none; }
.hero-title { position: absolute; left: 0; right: 0; bottom: 0; padding: 44px 16px 14px; pointer-events: none; background: linear-gradient(to top, rgba(2, 10, 24, .86), rgba(2, 10, 24, .45) 55%, transparent); }
.hero-name { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 26px; line-height: 1.1; font-weight: 700; text-shadow: 0 2px 10px rgba(0, 0, 0, .55); }
.hero-where { margin-top: 3px; font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
.hero-dots { position: absolute; top: 12px; right: 12px; display: flex; gap: 5px; padding: 5px 8px; border-radius: 10px; background: rgba(2, 10, 24, .45); pointer-events: none; }
.hero-dot { width: 6px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .45); transition: width .2s, background .2s; }
.hero-dot.on { width: 16px; background: #fff; }
.reduce .hero-dot { transition: none; }
.hero .pk-credit { top: 12px; bottom: auto; left: 12px; max-width: calc(100% - 110px); }

.pk-credit { position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 16px); padding: 3px 8px; border-radius: 10px; background: rgba(2, 10, 24, .62); color: rgba(255, 255, 255, .92); font-size: 10.5px; font-weight: 600; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); pointer-events: none; }
.pk-photo { position: relative; display: block; width: 100%; aspect-ratio: 16 / 10; padding: 0; border: 0; border-radius: 14px; overflow: hidden; background: #0c2744; cursor: zoom-in; margin: 0 0 10px; }
.pk-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.pk-photo.pk-photo-failed { display: none; }
.pk-item.has-photo { padding-top: 12px; }
.pk-item.has-photo:first-child { padding-top: 0; }
.pk-item.has-photo .pk-item-body { padding: 0 2px; }
@media (min-width: 640px) {
  .pk-item.has-photo { display: grid; grid-template-columns: minmax(0, 40%) minmax(0, 1fr); gap: 16px; align-items: start; }
  .pk-item.has-photo .pk-photo { margin: 0; }
  .hero { margin: 0 0 16px; border-radius: 22px; }
}

.viewer { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; background: #04070d; }
.viewer[hidden] { display: none; }
.viewer-track { display: flex; flex: 1 1 auto; min-height: 0; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.viewer-track::-webkit-scrollbar { display: none; }
.viewer-slide { flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always; display: flex; align-items: center; justify-content: center; margin: 0; padding: calc(56px + var(--safe-t)) 8px 8px; }
.viewer-slide img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; user-select: none; -webkit-user-select: none; }
.viewer-close { position: absolute; top: calc(10px + var(--safe-t)); right: calc(10px + var(--safe-r)); width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .25); background: rgba(20, 30, 46, .72); color: #fff; font-size: 18px; font-weight: 800; }
.viewer-bar { flex: 0 0 auto; display: flex; align-items: baseline; gap: 12px; padding: 10px 16px calc(14px + var(--safe-b)); font-size: 13px; color: rgba(255, 255, 255, .85); }
.viewer-count { flex: 0 0 auto; font-weight: 800; font-variant-numeric: tabular-nums; }
.viewer-credit { min-width: 0; line-height: 1.35; }
.viewer-link { color: #9ad6ff; }

/* The WebGL imagery layer sits directly under the 2D overlay canvas, same box. */
.globe-gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }

/* Map style switch (Options sheet). */
.opt-style { flex-direction: column; align-items: stretch; cursor: default; }
.seg { display: flex; padding: 3px; gap: 3px; border-radius: 14px; background: rgba(255, 255, 255, .08); }
.seg-btn { flex: 1 1 0; min-height: 40px; border: 0; border-radius: 11px; background: transparent; color: var(--ink-dim); font-weight: 800; font-size: 14.5px; }
.seg-btn[aria-checked="true"] { background: var(--teal); color: #052a1d; box-shadow: 0 2px 8px rgba(0, 0, 0, .3); }
.seg-btn:disabled { opacity: .35; }
.opt-credit { margin-top: 6px; font-size: 11.5px; opacity: .8; }

/* ---- Local food to try: a photo-forward grid, text cards for dishes without a picture, a detail sheet ---- */
.pk-dishes { margin: 6px 0 20px; }
.pk-dishes-title { margin: 0; display: flex; align-items: center; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; font-size: 23px; line-height: 1.15; font-weight: 700; letter-spacing: -0.005em; }
.pk-dishes-title .pk-icon { font-size: 21px; margin-right: 9px; }
.pk-dishes-sub { margin: 4px 0 12px; font-size: 13.5px; line-height: 1.4; color: var(--ink-dim); }
.dish-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 640px) { .dish-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; } }
@media (min-width: 960px) { .dish-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.dish-card { display: flex; flex-direction: column; align-items: stretch; min-width: 0; padding: 0; border: 1px solid var(--glass-edge); border-radius: 16px; overflow: hidden; background: var(--glass); color: var(--ink); text-align: left; cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, .22); transition: transform .12s, box-shadow .12s; }
.dish-card:active { transform: scale(.975); box-shadow: 0 3px 10px rgba(0, 0, 0, .25); }
.dish-card:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.reduce .dish-card { transition: none; }
.dish-photo { display: block; aspect-ratio: 1; overflow: hidden; background: #0c2744; }
.dish-photo img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .35s; }
.dish-card:hover .dish-photo img { transform: scale(1.04); }
.reduce .dish-photo img { transition: none; }
.dish-name { display: block; padding: 9px 11px 0; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 16.5px; line-height: 1.18; font-weight: 700; }
.dish-line { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; padding: 0 11px; margin: 3px 0 12px; font-size: 12.5px; line-height: 1.38; color: var(--ink-dim); }
/* A dish with no picture: a tinted card the same size as its neighbours, never a hole. */
.dish-text { justify-content: center; min-height: 150px; padding: 14px 13px 12px; background: linear-gradient(155deg, hsl(var(--dish-hue, 24) 62% 31%), hsl(calc(var(--dish-hue, 24) + 16) 55% 17%)); border-color: hsla(var(--dish-hue, 24), 80%, 70%, .28); }
.dish-text .dish-glyph { display: block; margin-bottom: 8px; font-size: 26px; line-height: 1; opacity: .92; }
.dish-text .dish-name { padding: 0; font-size: 19px; }
.dish-text .dish-line { padding: 0; margin: 5px 0 0; color: rgba(255, 244, 230, .82); -webkit-line-clamp: 4; line-clamp: 4; }

.dish-sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(2, 8, 18, .66); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.dish-sheet-card { position: relative; width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; -webkit-overflow-scrolling: touch; background: linear-gradient(180deg, #112c4d, #0a1f3a); border: 1px solid var(--glass-edge); border-radius: 24px 24px 0 0; box-shadow: 0 -12px 40px rgba(0, 0, 0, .5); }
@media (min-width: 700px) { .dish-sheet { align-items: center; } .dish-sheet-card { border-radius: 24px; max-height: 88%; } }
.dish-sheet-close { position: absolute; z-index: 2; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .28); background: rgba(8, 20, 38, .72); color: #fff; font-size: 17px; font-weight: 800; }
.dish-sheet-photo { position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; max-height: 46vh; padding: 0; border: 0; overflow: hidden; background: #0c2744; cursor: zoom-in; }
.dish-sheet-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.dish-sheet-photo.pk-photo-failed { display: none; }
.dish-sheet-body { padding: 16px 18px calc(22px + var(--safe-b)); }
.dish-sheet-card .dish-sheet-photo-host[hidden] + .dish-sheet-body { padding-top: 54px; }
.dish-sheet-kicker { font-size: 12.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
.dish-sheet-name { margin: 4px 0 8px; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 27px; line-height: 1.1; font-weight: 700; }
.dish-sheet-detail { margin: 0 0 12px; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 16.5px; line-height: 1.58; color: rgba(236, 244, 255, .9); }
.dish-sheet-wiki { margin: 0 0 8px; }
.dish-sheet-credit { font-size: 12px; line-height: 1.4; color: var(--ink-dim); }
.dish-sheet-credit .pk-link { font-size: 12px; margin: 0; }
.dish-sheet-credit .pk-link::after { content: ""; }
</style>
