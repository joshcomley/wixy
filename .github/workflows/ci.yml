name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      # Full history: test_cookout_modes_overlap.py loads the deployed v21 code from the
      # pinned commit 4d2b005c in git history (it fails, never skips, if absent).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # spec/server-chat/00-brief.md §7/§10 P2a: livechat/processing.py's tests
      # run REAL ffmpeg (never skipped/mocked), so the runner needs the binary.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: pip install -e ".[server,dev]"
      - name: Install Playwright chromium (parity harness)
        run: playwright install --with-deps chromium
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: mypy --strict
        run: mypy
      - name: pytest (fixed -n 4, never auto)
        run: pytest

  # decisions/00112: every commit carries a `Release-note:` trailer — the update
  # popup's "What's new in this version" list is harvested from exactly these
  # trailers, so a missing one = a deploy with nothing to tell the owner. PR-
  # only (main's own merge commits are exempt; the range they introduce was
  # already checked here); merge commits inside the PR are exempt too.
  release-note:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the base branch
        run: git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
      - name: Every PR commit carries a Release-note trailer
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "origin/${GITHUB_BASE_REF}..HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qi '^release-note[[:space:]]*:'; then
              echo "::error::commit $sha has no Release-note trailer (see CLAUDE.md — every commit needs one; use 'Release-note: General bug fixes and improvements.' when nothing is user-visible)"
              missing=1
            fi
          done
          exit $missing

  # spec/independence/07 §3: "Every external URL in the guide verified live
  # at build time." Builds fresh (not from committed output) so the drift
  # check catches a stale commit, then link-checks the fresh build against
  # the real internet.
  guide-linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -e ".[server,dev]"
      - name: Build the guide
        run: python -m guide
      - name: Guide bundle drift check (committed output must match a fresh build)
        run: git diff --exit-code -- wixy_server/static/guide
      - name: Link check (every external URL must be live)
        run: python -m guide.linkcheck

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: admin-ui install
        working-directory: admin-ui
        run: npm ci
      - name: admin-ui typecheck
        working-directory: admin-ui
        run: npm run typecheck
      - name: admin-ui test
        working-directory: admin-ui
        run: npm test
      - name: admin-ui build
        working-directory: admin-ui
        run: npm run build
      - name: editor install
        working-directory: editor
        run: npm ci
      - name: editor typecheck
        working-directory: editor
        run: npm run typecheck
      - name: editor test
        working-directory: editor
        run: npm test
      - name: editor build
        working-directory: editor
        run: npm run build
      - name: bundle drift check (committed bundles must match a fresh build)
        run: git diff --exit-code -- wixy_server/static

  e2e:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # spec/server-chat/00-brief.md §7/§10 P2a: server-chat media (voice/video)
      # e2e specs need real ffmpeg on the fixture server, same as the pytest job.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install wixy (server) — fixture_server.py imports it directly
        run: pip install -e ".[server,dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        working-directory: e2e
        run: npm ci
      - name: install playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: playwright test
        working-directory: e2e
        run: npx playwright test
      # A failure leaves screenshots + error-context.md (the page's accessibility snapshot) here;
      # without this step CI kept nothing and a flake could only be guessed at.
      - name: upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results/
          retention-days: 7

  # spec/independence/03 §5: the same image boots both editions — this is the
  # ONLY place that's ever proven (the hub has no Docker; Slots deploys the
  # fleet edition from source, never the image). Runs on every PR AND every
  # main push (stricter than the spec's literal "on every main merge" — a
  # broken image should never merge in the first place).
  image-boot-proof:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          # Either public registry can rate-limit a shared runner. Pull the mirror first,
          # then the same official tag from Docker Hub if the mirror is unavailable.
          base_image=public.ecr.aws/docker/library/python:3.14-slim
          if ! docker pull "$base_image"; then
            base_image=python:3.14-slim
            docker pull "$base_image"
          fi
          docker build -f deploy/standalone/Dockerfile \
            --build-arg PYTHON_IMAGE="$base_image" \
            --build-arg WIXY_ENGINE_SHA=${{ github.sha }} \
            -t wixy:ci .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install wixy (the fake-cmd harness needs it importable)
        run: pip install -e ".[server,dev]"
      - name: Start fake cmd on 127.0.0.1:9320 + :9321
        run: |
          nohup python deploy/standalone/ci_fake_cmd.py > fake_cmd.log 2>&1 &
          for _ in $(seq 1 20); do
            grep -q "fake cmd up" fake_cmd.log 2>/dev/null && break
            sleep 0.5
          done
          cat fake_cmd.log
      - name: Boot + assert — standalone edition
        run: |
          docker run -d --name wixy-standalone --network host \
            -e WIXY_EDITION=standalone -e WIXY_CONTAINERIZED=1 \
            -e WIXY_STORAGE_ROOT=/data -e WIXY_PORT=18001 \
            -e WIXY_DEV_NO_AUTH=1 -e WIXY_ENV=dev \
            wixy:ci
          ok=0
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18001/healthz >/dev/null 2>&1 && { ok=1; break; }
            sleep 1
          done
          docker logs wixy-standalone || true
          [ "$ok" -eq 1 ] || { echo "standalone /healthz never came up"; exit 1; }
          curl -fsS http://127.0.0.1:18001/api/version | tee /tmp/version-standalone.json
          grep -q '"edition":"standalone"' /tmp/version-standalone.json
          docker rm -f wixy-standalone
      - name: Boot + assert — fleet edition (cmd faked)
        run: |
          docker run -d --name wixy-fleet --network host \
            -e WIXY_EDITION=fleet -e WIXY_CONTAINERIZED=1 \
            -e WIXY_STORAGE_ROOT=/data -e WIXY_PORT=18002 \
            -e WIXY_DEV_NO_AUTH=1 -e WIXY_ENV=dev \
            wixy:ci
          ok=0
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18002/healthz >/dev/null 2>&1 && { ok=1; break; }
            sleep 1
          done
          docker logs wixy-fleet || true
          [ "$ok" -eq 1 ] || { echo "fleet /healthz never came up"; exit 1; }
          curl -fsS http://127.0.0.1:18002/api/version | tee /tmp/version-fleet.json
          grep -q '"edition":"fleet"' /tmp/version-fleet.json
          docker rm -f wixy-fleet
      # spec/server-chat/09b F.4: prove the image actually SERVES a baked Cookout picture. The
      # test pack is a deterministic two-ingredient pack (four tiny WebPs, committed) built into a
      # SECOND image through the identical Dockerfile path (fetch, bounds, sha checks, baked dir,
      # packaged manifest), from a copy of the workspace in which the committed manifest is replaced
      # by the test manifest and COOKOUT_PACK_URL points at a throwaway local HTTP server.
      - name: Cookout picture proof - test pack
        run: |
          pack_dir=deploy/standalone/ci/cookout-test-pack
          work="$RUNNER_TEMP/wixy-pack-workspace"
          mkdir -p "$RUNNER_TEMP/pack-serve" && rm -rf "$work"
          cp -r . "$work"
          cp "$pack_dir/manifest.json" "$work/wixy_server/livechat/cookout_ingredient_images.json"
          cp "$pack_dir/pack.tar" "$RUNNER_TEMP/pack-serve/cookout-test-pack.tar"
          (cd "$RUNNER_TEMP/pack-serve" && nohup python -m http.server 8099 --bind 127.0.0.1 \
            > "$RUNNER_TEMP/pack-serve.log" 2>&1 &)
          for _ in $(seq 1 20); do
            curl -fsS -o /dev/null http://127.0.0.1:8099/cookout-test-pack.tar && break
            sleep 0.5
          done
          base_image=public.ecr.aws/docker/library/python:3.14-slim
          docker pull "$base_image" || { base_image=python:3.14-slim; docker pull "$base_image"; }
          docker build --network host -f deploy/standalone/Dockerfile \
            --build-arg PYTHON_IMAGE="$base_image" \
            --build-arg COOKOUT_PACK_URL=http://127.0.0.1:8099/cookout-test-pack.tar \
            -t wixy:ci-pack "$work"
          bash deploy/standalone/ci/cookout_image_proof.sh wixy:ci-pack "$pack_dir/manifest.json" \
            wixy-cookout-test-pack
      # The real pack runs on every main build (publish-image.yml) and, here, only on PRs that
      # change the manifest (a path filter, so ordinary PRs never download ~150 MB).
      - name: Did this PR change the Cookout picture manifest?
        id: cookout-manifest
        run: |
          changed=0
          manifest=wixy_server/livechat/cookout_ingredient_images.json
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            git diff --quiet FETCH_HEAD HEAD -- "$manifest" || changed=1
          fi
          has_pack=$(python -c "import json,sys; print(int(json.load(open(sys.argv[1]))['pack'] is not None))" "$manifest")
          echo "run=$([ "$changed" = 1 ] && [ "$has_pack" = 1 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - name: Cookout picture proof - real pack
        if: steps.cookout-manifest.outputs.run == '1'
        run: |
          bash deploy/standalone/ci/cookout_image_proof.sh wixy:ci \
            wixy_server/livechat/cookout_ingredient_images.json wixy-cookout-real-pack
